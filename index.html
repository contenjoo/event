<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 AI 활용 교육 콘퍼런스</title>
<style>
  :root {
    --bg: #0f1226;
    --panel: #1a1f3c;
    --panel-2: #232a52;
    --accent: #ff5d8f;
    --accent-2: #6c5ce7;
    --text: #eef1ff;
    --muted: #9aa3cf;
    --border: #2e3566;
    --gold: #ffd36e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #2a2f63 0%, var(--bg) 55%) fixed;
    color: var(--text);
    min-height: 100vh;
  }
  header { text-align: center; padding: 46px 16px 10px; }
  header .kicker { font-size: 13px; font-weight: 800; letter-spacing: 3px; color: var(--accent); }
  header h1 {
    margin: 6px 0 0; font-size: 30px; letter-spacing: -0.5px;
    background: linear-gradient(120deg, var(--gold), var(--accent) 60%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  header p b { color: var(--text); }

  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px; }

  a.event {
    display: flex; align-items: center; gap: 16px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
    transition: .15s;
  }
  a.event:hover { border-color: var(--accent-2); transform: translateY(-2px); }
  a.event:active { transform: translateY(1px); }
  .event .logo { font-size: 40px; flex: 0 0 auto; }
  .event .name { font-size: 19px; font-weight: 800; }
  .event .desc { font-size: 13.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .event .go { margin-left: auto; color: var(--accent); font-size: 22px; }
  .event .badge {
    display: inline-block; margin-left: 8px; vertical-align: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 11px; font-weight: 800;
    border-radius: 999px; padding: 2px 8px;
  }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0 32px; }
</style>
</head>
<body>
<header>
  <div class="kicker">2026 AI 활용 교육 콘퍼런스</div>
  <h1>수업의 별 광장</h1>
  <p>참여할 이벤트를 선택하세요 · with <b>오늘배움</b></p>
</header>

<div class="wrap">
  <a class="event" href="/stars.html">
    <span class="logo">✨</span>
    <span>
      <span class="name">수업의 별 찾기<span class="badge">참여</span></span>
      <div class="desc">은박을 긁어 나만의 수업 별을 찾아요. AI 도구를 고르고 별 3개를 맞추면 체험 이용권 당첨!</div>
    </span>
    <span class="go">›</span>
  </a>

  <a class="event" href="/constellation.html">
    <span class="logo">🌌</span>
    <span>
      <span class="name">미래교실 별자리<span class="badge">TV</span></span>
      <div class="desc">선생님들이 밝힌 수업의 별이 실시간으로 켜지는 대형 화면. 행사장 TV 전시용.</div>
    </span>
    <span class="go">›</span>
  </a>
</div>

<footer>2026 AI 활용 교육 콘퍼런스 · with 오늘배움</footer>
</body>
</html>
